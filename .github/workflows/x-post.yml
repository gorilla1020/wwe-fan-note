name: x-post
on:
  push:
    branches: [main]
    paths: ['xbot/queue/**']
  workflow_dispatch:
concurrency:
  group: x-post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests requests-oauthlib
      - name: post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python xbot/post.py
      - name: save state
        if: always()
        run: |
          git config user.name "WWE fan note bot"
          git config user.email "bot@users.noreply.github.com"
          git add xbot/state.json xbot/log.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "x: 投稿の記録 [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
